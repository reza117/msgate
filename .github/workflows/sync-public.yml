name: Sync to Public Repo

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PUBLIC_DEPLOY_KEY }}

      - name: Add GitHub to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Remove Private Files
        run: |
          # --- FOLDERS TO REMOVE ---
          rm -rf Private-Docs/
          rm -rf docs/private/
          rm -rf .private/

          # --- SPECIFIC FILES TO REMOVE ---
          #rm -f PRIVATE_NOTES.md
          #rm -f todo-private.txt

          # --- FILE PATTERNS TO REMOVE ---
          #rm -f *.private.md
          #rm -f *.secret

      - name: Push Code and Tags to Public Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote set-url origin git@github.com:reza117/msgate.git

          # Stage clean files and commit if changes exist
          git add -A
          git commit -m "Automated sync from private source [skip ci]" || true

          # Explicitly push main branch and tags
          git push origin HEAD:refs/heads/main --tags --force

      - name: Create GitHub Release on Public Repo
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          repository: reza117/msgate
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          generate_release_notes: true