[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msgate"
version = "0.0.11"
description = "SMTP gateway to Exchange EWS and Microsoft Graph"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "msgate contributors" }]
dependencies = [
  "pydantic>=2.6",
  "pydantic[email]>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "aiosmtpd>=1.4",
  "exchangelib>=5.4",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "cryptography>=42.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "httpx>=0.27",
]

[project.scripts]
msgate = "msgate.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/msgate"]

[tool.hatch.build.targets.wheel.sources]
"src/msgate" = "msgate"

# HTML templates ship with the package tree (do NOT also force-include —
# that duplicates paths and fails newer hatchling with:
# "A second file is being added to the wheel ... account.html").

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/msgate/api/**" = ["B008"]
