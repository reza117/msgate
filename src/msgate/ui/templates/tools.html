{% extends "base.html" %}
{% block content %}
<div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
  <section class="bg-slate-900 border border-slate-800 rounded-lg p-4">
    <h2 class="text-sm font-medium text-slate-400 mb-3">Send Test Email</h2>
    <form class="space-y-3 text-sm" hx-post="/api/v1/tools/send-test" hx-swap="none"
          hx-on::after-request="alert(event.detail.successful ? 'Queued — check Messages' : 'Failed')">
      <input name="sender" placeholder="From" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2" required>
      <input name="recipients" placeholder="To (comma-separated)" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2" required>
      <input name="subject" placeholder="Subject" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2" required>
      <textarea name="body" placeholder="Body" rows="4" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2" required></textarea>
      <button type="submit" class="px-4 py-2 rounded bg-blue-600 hover:bg-blue-500">Send</button>
    </form>
    <p class="text-xs text-slate-500 mt-2">Uses EWS credentials from config.</p>
  </section>

  <section id="auth" class="bg-slate-900 border border-slate-800 rounded-lg p-4">
    <h2 class="text-sm font-medium text-slate-400 mb-3">Auth Simulator</h2>
    <form hx-post="/api/v1/tools/auth-simulate" hx-target="#auth-result" hx-swap="innerHTML" class="space-y-3 text-sm">
      <select name="mechanism" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2">
        <option value="PLAIN">AUTH PLAIN (base64)</option>
        <option value="LOGIN">AUTH LOGIN (base64 user)</option>
      </select>
      <textarea name="payload" rows="3" placeholder="Base64 payload" class="w-full mono bg-slate-950 border border-slate-700 rounded px-3 py-2" required></textarea>
      <button type="submit" class="px-4 py-2 rounded bg-slate-700 hover:bg-slate-600">Simulate</button>
    </form>
    <div id="auth-result" class="mt-4 mono text-xs"></div>
  </section>
</div>

<section class="mt-6 bg-slate-900 border border-slate-800 rounded-lg p-4">
  <h2 class="text-sm font-medium text-slate-400 mb-3">Exchange Health Check</h2>
  <button hx-post="/api/v1/tools/ews-health" hx-target="#health-result" hx-swap="innerHTML"
          class="px-4 py-2 rounded bg-purple-700 hover:bg-purple-600 text-sm">Run health check</button>
  <div id="health-result" class="mt-4 mono text-xs"></div>
</section>
{% endblock %}

{% block scripts %}
<script>
document.body.addEventListener('htmx:afterSwap', (e) => {
  if ((e.target.id === 'auth-result' || e.target.id === 'health-result') && e.detail.xhr.response) {
    try {
      const j = JSON.parse(e.detail.xhr.response);
      e.target.innerHTML = '<pre class="bg-slate-950 p-3 rounded">' + JSON.stringify(j, null, 2) + '</pre>';
    } catch (_) {}
  }
});
</script>
{% endblock %}
