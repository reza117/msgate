<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
  <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
    <div class="text-xs text-slate-400">Sent today</div>
    <div class="text-2xl font-semibold mt-1">{{ stats.sent_today }}</div>
  </div>
  <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
    <div class="text-xs text-slate-400">Avg latency</div>
    <div class="text-2xl font-semibold mt-1">{{ '%.0f'|format(stats.backend_latency_ms) }}ms</div>
  </div>
  <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
    <div class="text-xs text-slate-400">Auth errors (24h)</div>
    <div class="text-2xl font-semibold mt-1">{{ stats.auth_errors_24h }}</div>
  </div>
  <div class="bg-slate-900 border border-slate-800 rounded-lg p-4">
    <div class="text-xs text-slate-400">Queue pending</div>
    <div class="text-2xl font-semibold mt-1">{{ stats.queue_pending }}</div>
  </div>
</div>
