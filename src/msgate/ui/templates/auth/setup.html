{% extends "auth/layout.html" %}
{% block content %}
<h2 class="text-lg font-medium mb-4 text-center">Create administrator password</h2>
<p class="text-slate-400 text-sm mb-6 text-center">Username: <span class="text-slate-200 font-mono">admin</span></p>
<form method="post" action="/ui/auth/setup" class="space-y-4">
  <div>
    <label class="block text-sm text-slate-400 mb-1" for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="8"
           class="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 focus:border-blue-500 outline-none">
  </div>
  <div>
    <label class="block text-sm text-slate-400 mb-1" for="password_confirm">Confirm password</label>
    <input id="password_confirm" name="password_confirm" type="password" required minlength="8"
           class="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 focus:border-blue-500 outline-none">
  </div>
  <button type="submit" class="w-full py-2 rounded bg-blue-600 hover:bg-blue-500 font-medium">
    Create account
  </button>
</form>
{% endblock %}
