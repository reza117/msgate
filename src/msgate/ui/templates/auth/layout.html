<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>msgate — {% block title %}Auth{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-lg p-8 shadow-xl">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-semibold">msgate</h1>
      <p class="text-slate-400 text-sm mt-1">v{{ version }}</p>
    </div>
    {% if error %}
    <div class="mb-4 px-3 py-2 rounded bg-red-900/40 border border-red-800 text-red-200 text-sm">
      {{ error }}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
