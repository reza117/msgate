{% extends "auth/layout.html" %}
{% block content %}
<h2 class="text-lg font-medium mb-4 text-center">Sign in</h2>
<form method="post" action="/ui/auth/login" class="space-y-4">
  <div>
    <label class="block text-sm text-slate-400 mb-1" for="username">Username</label>
    <input id="username" name="username" type="text" value="admin" readonly
           class="w-full px-3 py-2 rounded bg-slate-800 border border-slate-700 text-slate-400">
  </div>
  <div>
    <label class="block text-sm text-slate-400 mb-1" for="password">Password</label>
    <input id="password" name="password" type="password" required autofocus
           class="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 focus:border-blue-500 outline-none">
  </div>
  <button type="submit" class="w-full py-2 rounded bg-blue-600 hover:bg-blue-500 font-medium">
    Sign in
  </button>
</form>
{% endblock %}
