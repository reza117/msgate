{% extends "auth/layout.html" %}
{% block content %}
<h2 class="text-lg font-medium mb-2 text-center">Change password</h2>
<p class="text-amber-300/90 text-sm mb-6 text-center bg-amber-950/40 border border-amber-900 rounded px-3 py-2">
  Temporary password in use — choose a new password to continue.
</p>
<form method="post" action="/ui/auth/change-password" class="space-y-4">
  <div>
    <label class="block text-sm text-slate-400 mb-1" for="current_password">Current password</label>
    <input id="current_password" name="current_password" type="password" required autofocus
           class="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 focus:border-blue-500 outline-none">
  </div>
  <div>
    <label class="block text-sm text-slate-400 mb-1" for="password">New password</label>
    <input id="password" name="password" type="password" required minlength="8"
           class="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 focus:border-blue-500 outline-none">
  </div>
  <div>
    <label class="block text-sm text-slate-400 mb-1" for="password_confirm">Confirm new password</label>
    <input id="password_confirm" name="password_confirm" type="password" required minlength="8"
           class="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 focus:border-blue-500 outline-none">
  </div>
  <button type="submit" class="w-full py-2 rounded bg-blue-600 hover:bg-blue-500 font-medium">
    Update password
  </button>
</form>
{% endblock %}
